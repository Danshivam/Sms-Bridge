<!DOCTYPE html>
<html>

<head>
    <title>SMS Bridge</title>

    <link
        rel="stylesheet"
        href="/static/style.css">
</head>


<body>

<div class="header">
    
    <div class="logo">
        SMS Bridge 😋
    </div>

    <div class="status">
        🟢 Connected
    </div>

</div>

<h2 id="count">
    Notifications
</h2>

<div id="notifications">

</div>

<script>

const notifications = {{ notifications_json | safe }};
    

const socket = new WebSocket("ws://192.168.1.3:8000/ws");

socket.onopen = () => {
    console.log("Connected to WebSocket");
};

socket.onclose = () => {
    console.log("Disconnected");
};

socket.onerror = (error) => {
    console.error(error);
};

let lastDateGroup = null;

function createNotificationCard(notification){

    const container = document.getElementById("notifications");

    if (notification.date_group !== lastDateGroup) {

        const dateGroup = document.createElement("div");

        dateGroup.className = "date-group";

        dateGroup.textContent = notification.date_group.toUpperCase();

        container.appendChild(dateGroup);

        lastDateGroup = notification.date_group;
    }

    const card = document.createElement("div");

    card.className = "card";

    if(notification.is_otp){

        card.innerHTML = `
            <div class="app">You got an OTP</div>

            <div class="title">${notification.title}</div>

            <div class="message"
                style="
                font-size:34px;
                font-weight:bold;
                color:#18a558;
                letter-spacing:3px;
                ">
                ${notification.otp}
            </div>

            <button class="copy-btn">
                ⧉
            </button>

            <div class="time">
                🕒 ${notification.formatted_time}
            </div>
        `;

        const button = card.querySelector(".copy-btn");

        button.onclick = () => {

            navigator.clipboard.writeText(notification.otp);

            button.innerText = "✓";

            setTimeout(() => {

                button.innerText = "⧉";

            },1500);

        };

    }

    else{

        card.innerHTML = `
            <div class="app">${notification.app}</div>

            <div class="title">${notification.title}</div>

            <div class="message">${notification.message}</div>

            <div class="time">
                🕒 ${notification.formatted_time}
            </div>
        `;

    }

    container.prepend(card);

}

notifications.forEach(notification => {

    createNotificationCard(notification);

});

socket.onmessage = (event)=>{

    const notification = JSON.parse(event.data);

    createNotificationCard(notification);

};

</script>

</body>

</html>
